paths:
  model_repo: /path/to/Noise-Robustness-Evaluation-Protocol/EEG-FM/CBraMod
  checkpoint: pretrained_weights/pretrained_weights.pth
  h5_file: /path/to/canonical_tuab_full.h5
  split_index: /path/to/canonical_split_index.csv
  original_data: /path/to/original/cbramod_pkls
  output: outputs/cbramod

data:
  source: unified60
  train_samples: 8192
  validation_samples: 2048
  test_samples: 2048

loader:
  batch_size: 64
  num_workers: 8
  shuffle_train: true
  drop_last_train: false
  pin_memory: true

model:
  variant: all_patch_reps

training:
  seeds: [0, 42, 123, 256, 512]
  epochs: 15
  loss: bce_with_logits
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.05
  scheduler: cosine
  scheduler_step: batch
  minimum_learning_rate: null
  gradient_clip_norm: 1.0
  mixed_precision: false

# Choose full_finetune, linear_probe, or lora.
fine_tuning:
  strategy: full_finetune
  lora:
    rank: 8
    alpha: 16
    dropout: 0.0

evaluation:
  selection_metric: auroc
  classification_threshold: 0.5
  report_metrics: [balanced_accuracy, auroc, auprc]
