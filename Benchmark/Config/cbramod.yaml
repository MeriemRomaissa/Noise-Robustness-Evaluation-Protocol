# These are the fields to edit.
paths:
  h5_file: /nicoletye/workspace/unified_tuab/data/canonical_tuab_full.h5
  split_index: /nicoletye/workspace/unified_tuab/reports/canonical_h5_labram_referenced_max_coverage_split_index.csv
  original_data: /path/to/original/cbramod_pkls
  model_repo: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/EEG-FM/CBraMod
  # Expected by EEG-FM/CBraMod/README.md and model_for_tuab.py.
  # The checkpoint file is an EEG-FM dependency and is not stored in Benchmark.
  checkpoint: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/EEG-FM/CBraMod/pretrained_weights/pretrained_weights.pth
  output: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/full finetuning/cbramod
  strategy_outputs:
    full_finetune: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/full finetuning/cbramod
    freeze_backbone: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/freeze backbone/cbramod
    lora: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/lora/cbramod

data:
  source: tuab_unified60

study_case:
  tuab_mode: subset_tuab  # options: [subset_tuab, full_tuab]

loader:
  batch_size: 64
  num_workers: 8
  shuffle_train: true # training data should be shuffled
  drop_last_train: true # usually true for stable training, but can be false for small datasets
  pin_memory: true # true if using GPU, false if using CPU

training:
  seeds: [0, 42, 123, 256, 512]
  epochs: 15
  learning_rate: 0.0001

fine_tuning:
  strategy: full_finetune  # choices: [full_finetune, freeze_backbone, lora]

fixed_recipe:
  model:
    downstream_dataset: TUAB
    num_of_classes: 2
    classifier: all_patch_reps
    dropout: 0.1
    use_pretrained_weights: true
  training:
    weight_decay: 0.05
    optimizer: AdamW
    clip_value: 1
    label_smoothing: 0.1
    multi_lr: true
    frozen: false

evaluation:
  selection_metric: roc_auc
  classification_threshold: 0.5
  report_metrics: [balanced_accuracy, roc_auc, pr_auc, accuracy]

# NMT OOD inference inputs. Repository-relative paths resolve from project root.
inference:
  nmt_dir: /nicoletye/workspace/nmt_scalp_eeg_labram_ood/test
  eegnet_json: Benchmark/Config/eegnet_nmt_baseline.json
  output: Benchmark/Outputs/nmt_ood/cbramod
  checkpoints:
    full_finetune: Benchmark/Outputs/full finetuning/cbramod/checkpoint-best.pth
    freeze_backbone: Benchmark/Outputs/freeze backbone/cbramod/checkpoint-best.pth
    lora: Benchmark/Outputs/lora/cbramod/checkpoint-best.pth
  max_samples: null
  device: null
