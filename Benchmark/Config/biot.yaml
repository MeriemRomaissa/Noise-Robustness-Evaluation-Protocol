# These are the fields to edit.
paths:
  h5_file: /nicoletye/workspace/unified_tuab/data/canonical_tuab_full.h5
  split_index: /nicoletye/workspace/unified_tuab/reports/canonical_h5_labram_referenced_max_coverage_split_index.csv
  original_data: /path/to/original/biot_pkls
  model_repo: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/EEG-FM/Biot
  # Expected by EEG-FM/Biot/README.md reference runs.
  # The checkpoint file is an EEG-FM dependency and is not stored in Benchmark.
  checkpoint: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/EEG-FM/Biot/pretrained-models/EEG-PREST-16-channels.ckpt
  output: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/full finetuning/biot
  strategy_outputs:
    full_finetune: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/full finetuning/biot
    freeze_backbone: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/freeze backbone/biot
    lora: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/lora/biot

data:
  source: tuab_unified60

study_case:
  tuab_mode: subset_tuab  # options: [subset_tuab, full_tuab]

loader:
  batch_size: 64
  num_workers: 32
  shuffle_train: true # training data should be shuffled
  drop_last_train: true # usually true for stable training, but can be false for small datasets
  pin_memory: true # true if using GPU, false if using CPU

training:
  seeds: [0, 42, 123, 256, 512] # run all
  epochs: 15
  learning_rate: 0.001

fine_tuning:
  strategy: full_finetune  # choices: [full_finetune, freeze_backbone, lora]

fixed_recipe:
  model:
    dataset: TUAB
    model: BIOT
    in_channels: 16
    sample_length: 10
    n_classes: 1
    sampling_rate: 200
    token_size: 200
    hop_length: 100
  training:
    weight_decay: 1.0e-5
  data:
    normalization_epsilon: 1.0e-8

evaluation:
  selection_metric: roc_auc
  classification_threshold: 0.5
  report_metrics: [balanced_accuracy, roc_auc, pr_auc, accuracy] # report all

# NMT OOD inference inputs. Repository-relative paths resolve from project root.
inference:
  nmt_dir: /nicoletye/workspace/nmt_scalp_eeg_labram_ood/test
  eegnet_json: Benchmark/Config/eegnet_nmt_baseline.json
  output: Benchmark/Outputs/nmt_ood/biot
  checkpoints:
    full_finetune: Benchmark/Outputs/full finetuning/biot/checkpoint-best.pth
    freeze_backbone: Benchmark/Outputs/freeze backbone/biot/checkpoint-best.pth
    lora: Benchmark/Outputs/lora/biot/checkpoint-best.pth
  max_samples: null
  device: null
