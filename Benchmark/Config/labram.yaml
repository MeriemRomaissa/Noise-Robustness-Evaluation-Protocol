# These are the fields to edit.
paths:
  h5_file: /path/to/canonical_tuab_full.h5
  split_index: /path/to/canonical_split_index.csv
  original_data: /path/to/original/labram_pkls
  output: outputs/labram

data:
  source: tuab_unified60

study_case:
  tuab_mode: subset_tuab  # options: [subset_tuab, full_tuab]
  channel_mode: 23channels  # options: [23channels, 16channels_zeropadded]

loader:
  batch_size: 64

training:
  seeds: [0, 42, 123, 256, 512]
  epochs: 15

fine_tuning:
  strategy: full_finetune  # choices: [full_finetune, freeze_backbone, lora]

evaluation:
  selection_metric: balanced_accuracy
  classification_threshold: 0.5
  report_metrics: [balanced_accuracy, roc_auc, pr_auc, accuracy]

# Locked LaBraM recipe. Do not tune these for benchmark comparisons.
fixed_recipe:
  # Sources: EEG-FM/Labram/run_class_finetuning.py get_args/get_models,
  # EEG-FM/Labram/README.md TUAB command, EEG-FM/Labram/modeling_finetune.py.
  paths:
    model_repo: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/EEG-FM/Labram
    checkpoint: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/EEG-FM/Labram/checkpoints/labram-base.pth
  loader:
    num_workers: 8
    shuffle_train: true
    drop_last_train: false
    pin_memory: true
  model:
    name: labram_base_patch200_200
    num_classes: 1
    EEG_size: 2000
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.1
    init_values: 0.1
    qkv_bias: false
    use_abs_pos_emb: true
    use_rel_pos_bias: false
  training:
    loss: bce_with_logits
    optimizer: adamw
    learning_rate: 0.0005
    weight_decay: 0.05
    scheduler: cosine
    scheduler_step: batch
    minimum_learning_rate: null
    gradient_clip_norm: null
    mixed_precision: false
