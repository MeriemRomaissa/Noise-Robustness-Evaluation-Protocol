# User-editable LaBraM run controls.
# Correction note: EEG-FM/Labram/run_class_finetuning.py now loads this YAML
# first as argparse defaults. Terminal CLI flags still override YAML values.
paths:
  # Used by Benchmark-native loaders. The original LaBraM EDF/PKL trainer does
  # not consume H5 rows directly.
  h5_file: /nicoletye/workspace/unified_tuab/data/canonical_tuab_full.h5
  split_index: /nicoletye/workspace/unified_tuab/reports/canonical_h5_labram_referenced_max_coverage_split_index.csv

  # Mapped to the original LaBraM --data_path argument.
  original_data: /path/to/original/labram_pkls

  # Benchmark connector provenance. The connector calls this repo's
  # EEG-FM/Labram/run_class_finetuning.py directly.
  model_repo: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/EEG-FM/Labram

  # Mapped to original LaBraM --finetune.
  checkpoint: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/EEG-FM/Labram/checkpoints/labram-base.pth

  # The Benchmark connector selects one of these from fine_tuning.strategy.
  output: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/full finetuning/labram
  strategy_outputs:
    full_finetune: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/full finetuning/labram
    freeze_backbone: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/freeze backbone/labram
    lora: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/Benchmark/Outputs/lora/labram

data:
  # Benchmark-native source label. Original LaBraM uses --dataset TUAB plus
  # paths.original_data, so this value is not passed to the author script.
  source: tuab_unified60

study_case:
  # Benchmark-native controls. Original LaBraM ignores these; use a
  # Benchmark-native trainer for H5/channel ablation study cases.
  tuab_mode: subset_tuab  # options: [subset_tuab, full_tuab]
  channel_mode: 23channels  # options: [23channels, 16channels_zeropadded]

loader:
  # batch_size/num_workers/pin_memory map to native LaBraM args.
  batch_size: 64
  num_workers: 8
  pin_memory: true

  # Correction note: original LaBraM controls shuffle/drop_last internally via
  # DistributedSampler and train DataLoader(drop_last=True). These are kept for
  # Benchmark-native runners but are not passed to run_class_finetuning.py.
  shuffle_train: true
  drop_last_train: true

training:
  # Original LaBraM trains one seed per process. If this list is read directly
  # by run_class_finetuning.py, the first seed is used; runner scripts should
  # append --seed for each concrete job.
  seeds: [0, 42, 123, 256, 512]
  epochs: 15
  learning_rate: 0.0005

fine_tuning:
  # Mapped to native --finetune_strategy. full_finetune maps to LaBraM's
  # original strategy name because the author script calls it "original".
  strategy: full_finetune  # choices: [full_finetune, freeze_backbone, lora]

evaluation:
  # Benchmark-native reporting controls. The original LaBraM script keeps its
  # TUAB metrics list internally.
  selection_metric: roc_auc
  classification_threshold: 0.5
  report_metrics: [balanced_accuracy, roc_auc, pr_auc, accuracy]

# NMT OOD inference inputs. Repository-relative paths are resolved from the
# project root, so inference can be launched from any working directory.
inference:
  nmt_dir: /nicoletye/workspace/nmt_scalp_eeg_labram_ood/test
  eegnet_json: Benchmark/Config/eegnet_nmt_baseline.json
  output: Benchmark/Outputs/nmt_ood/labram
  checkpoints:
    full_finetune: Benchmark/Outputs/full finetuning/labram/checkpoint-best.pth
    freeze_backbone: Benchmark/Outputs/freeze backbone/labram/checkpoint-best.pth
    lora: Benchmark/Outputs/lora/labram/checkpoint-best.pth
  max_samples: null  # Set an integer for a smoke test; null evaluates all NMT samples.
  device: null  # null selects CUDA when available, otherwise CPU.
