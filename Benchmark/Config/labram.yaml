# user can edit configures / choose configurable options.
paths:
  h5_file: /path/to/canonical_tuab_full.h5
  split_index: /path/to/canonical_split_index.csv
  original_data: /path/to/original/labram_pkls
  model_repo: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/EEG-FM/Labram
  checkpoint: /path/to/Checkpoints/labram-base.pth
  output: /path/to/Outputs/Labram

data:
  source: tuab_unified60 # for TUAB

study_case:
  tuab_mode: subset_tuab  # options: [subset_tuab, full_tuab]
  channel_mode: 23channels  # options: [23channels, 16channels_zeropadded]

loader:
  batch_size: 64
  num_workers: 8
  shuffle_train: true # training data should be shuffled
  drop_last_train: true # usually true for stable training, but can be false for small datasets
  pin_memory: true # true if using GPU, false if using CPU

training:
  seed: [0, 42, 123, 256, 512]
  epochs: 15

learning_rate: 0.0005

fine_tuning:
  strategy: full_finetune  # choices: [full_finetune, freeze_backbone, lora]

evaluation:
  selection_metric: roc_auc
  classification_threshold: 0.5
  report_metrics: [balanced_accuracy, roc_auc, pr_auc, accuracy]


