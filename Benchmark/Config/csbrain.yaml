# These are the fields to edit.
paths:
  h5_file: /path/to/canonical_tuab_full.h5
  split_index: /path/to/canonical_split_index.csv
  original_data: /path/to/original/csbrain_pkls
  output: outputs/csbrain

data:
  source: tuab_unified60

study_case:
  tuab_mode: subset_tuab  # options: [subset_tuab, full_tuab]

loader:
  batch_size: 64

training:
  seeds: [0, 42, 123, 256, 512]
  epochs: 15

fine_tuning:
  strategy: full_finetune  # choices: [full_finetune, freeze_backbone, lora]

evaluation:
  selection_metric: balanced_accuracy
  classification_threshold: 0.5
  report_metrics: [balanced_accuracy, roc_auc, pr_auc, accuracy]

# Locked CSBrain recipe. Do not tune these for benchmark comparisons.
fixed_recipe:
  # Sources: EEG-FM/CSBrain/finetune_main.py, finetune_trainer.py,
  # models/model_for_tuab.py, and sh/finetune_CSBrain_TUAB.sh.
  paths:
    model_repo: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/EEG-FM/CSBrain
    checkpoint: /nicoletye/workspace/Noise-Robustness-Evaluation-Protocol/EEG-FM/CSBrain/pth/CSBrain.pth
  data:
    scale_mode: div100
  loader:
    num_workers: 8
    shuffle_train: true
    drop_last_train: false
    pin_memory: true
  model:
    model: CSBrain
    use_pretrained_weights: false
    dropout: 0.1
    cuda: 0
    foundation_dir: ""
  training:
    loss: bce_with_logits
    optimizer: adamw
    learning_rate: 0.0001
    weight_decay: 0.05
    scheduler: cosine
    scheduler_step: batch
    minimum_learning_rate: 0.000001
    gradient_clip_norm: 1.0
    mixed_precision: false
